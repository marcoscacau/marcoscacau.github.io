name: Teste da busca (temporário)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow pyyaml markdown-it-py
      - name: Busca numa cópia, sem o texto vida e sem o post mais recente do Instagram
        run: |
          cp -r . /tmp/t && cd /tmp/t
          cp conteudo/textos/vida.md /tmp/vida_original.md
          cp conteudo/notas/2026-07-14-*.md /tmp/ig_original.md
          rm conteudo/textos/vida.md conteudo/notas/2026-07-14-*.md
          python -c "import json;f='gerador/dados/vistos.json';v=json.load(open(f));v['substack'].remove('vida');v['instagram'].remove('DayM3CdIIBV');json.dump(v,open(f,'w'))"
          python gerador/substack.py
          python gerador/instagram.py
          echo "=== diferença vida"; diff /tmp/vida_original.md conteudo/textos/vida.md && echo IGUAL
          echo "=== diferença instagram"; diff /tmp/ig_original.md conteudo/notas/2026-07-14-*.md && echo IGUAL
