name: Teste da busca (temporário)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Quais endereços respondem a partir do GitHub
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in \
            "https://marcoscacau.substack.com/feed" \
            "https://marcoscacau.substack.com/api/v1/archive?sort=new&offset=0&limit=12" \
            "https://substack.com/api/v1/profile/posts?profile_user_id=308494937&limit=12" \
            "https://substack.com/@marcoscacau" \
            "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmarcoscacau.substack.com%2Ffeed" \
            "https://www.instagram.com/marcos_cacau/embed/" \
            "https://www.instagram.com/p/DVZx8pnjsX5/embed/captioned/" ; do
            echo "$(curl -s -o /tmp/r -w '%{http_code}' -A "$UA" "$u") $(wc -c < /tmp/r) $u"
          done
          curl -s -A "$UA" "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmarcoscacau.substack.com%2Ffeed" | head -c 400; echo
          curl -s -A "$UA" "https://www.instagram.com/p/DVZx8pnjsX5/embed/captioned/" | grep -o 'EmbeddedMediaImage\|Caption\|contextJSON\|login' | sort | uniq -c
