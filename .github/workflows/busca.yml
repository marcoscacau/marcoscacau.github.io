name: Busca de livros (temporário)
on: workflow_dispatch
jobs:
  busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python gerador/_buscar_google.py
      - uses: actions/upload-artifact@v7
        with:
          name: livros
          path: saida_livros
